<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>איגרת תודה 🎂 — חיים של אחרים</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=249">
<style>
  /* טיוטת עיצוב לאיגרת תודה על מתנת יום הולדת (24.9). ?name=שם התורם  ?dog=slug */
  body { background: #f3eefa; }
  .ty-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 30px 16px; }
  .ty-card { position: relative; overflow: hidden; width: min(640px, 100%); border-radius: 28px; padding: 46px 34px 34px; text-align: center; color: #fff;
    background: linear-gradient(160deg, #2E7BA0, #7C5CBF 60%, #E0678F); box-shadow: 0 24px 60px rgba(60,30,110,.3); }
  .ty-card .confetti i { animation-duration: 6s; }
  .ty-inner { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .ty-photo { width: 190px; height: 190px; border-radius: 50%; object-fit: cover; border: 6px solid #fff; box-shadow: 0 10px 26px rgba(0,0,0,.25); }
  .ty-hat { font-size: 46px; margin-bottom: -34px; position: relative; z-index: 3; transform: rotate(-14deg); }
  .ty-card h1 { font-family: 'Rubik', sans-serif; font-size: 40px; margin: 6px 0 0; }
  .ty-card .ty-to { font-size: 22px; font-weight: 800; color: #ffe14d; margin: 0; }
  .ty-card p { margin: 0; font-size: 18px; color: #f6efff; max-width: 470px; line-height: 1.7; }
  .ty-sign { margin-top: 10px; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 19px; }
  .ty-paw { font-size: 30px; }
  .ty-logo { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-weight: 700; font-size: 14px; color: #efe6ff; }
  .ty-logo img { width: 34px; height: 34px; border-radius: 50%; }
  .ty-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  @media print { .ty-actions { display: none; } body { background: #fff; } .ty-wrap { min-height: auto; } }
</style>
</head>
<body>
<div class="ty-wrap">
  <div class="ty-card">
    <div class="confetti" aria-hidden="true">
      <i style="left:6%; background:#ffe14d; animation-delay:0s"></i>
      <i style="left:22%; background:#fff; animation-delay:1.4s"></i>
      <i style="left:38%; background:#45BEC9; animation-delay:.6s"></i>
      <i style="left:62%; background:#ffe14d; animation-delay:2s"></i>
      <i style="left:78%; background:#fff; animation-delay:.3s"></i>
      <i style="left:92%; background:#45BEC9; animation-delay:1.1s"></i>
    </div>
    <div class="ty-inner">
      <span class="ty-hat" aria-hidden="true">🥳</span>
      <img class="ty-photo" data-bd-img src="assets/img/dog-shuki-1.jpg" alt="">
      <h1>תודה על המתנה! 🎁</h1>
      <p class="ty-to" id="ty-to"></p>
      <p>בזכותכם יום ההולדת שלי היה הכי שמח בבית המחסה! פינקתם אותי, ועשיתם לי את הלב (ואת הזנב 🐕) לכשכש בלי הפסקה.</p>
      <p>ועכשיו אני כבר מחכה לכם — עם ליקוק גדול כשתבואו לבקר.</p>
      <div class="ty-sign">באהבה, <span data-bd-name>שוקי</span> <span class="ty-paw">🐾</span></div>
      <div class="ty-logo"><img src="assets/img/logo.jpg" alt="">וכל המשפחה של עמותת חיים של אחרים</div>
    </div>
  </div>
  <div class="ty-actions">
    <button class="btn btn-gold" type="button" onclick="window.print()">⬇ הורדה / הדפסה</button>
    <a class="btn btn-outline-green" href="birthday.html">חזרה לעמוד יום ההולדת</a>
  </div>
</div>
<script src="js/birthdays.js?v=249"></script>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var name = (p.get('name') || '').trim().slice(0, 40);
    document.getElementById('ty-to').textContent = name ? 'ל' + name + ' היקרים,' : '';
    var slug = p.get('dog');
    var dog = slug && window.LOO_DOGS && window.LOO_DOGS[slug];
    if (dog) {
      document.querySelectorAll('[data-bd-name]').forEach(function (el) { el.textContent = dog.name; });
      document.querySelectorAll('[data-bd-img]').forEach(function (el) { el.src = dog.img; });
    }
  })();
</script>
</body>
</html>
